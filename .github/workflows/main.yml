name: Update profile README

on:
  schedule:
    - cron: '30 18 * * *'   # runs daily at 18:30 UTC — adjust as you like
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stats and update SVGs
        run: python3 today.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add dark_mode.svg light_mode.svg cache/
          git diff --staged --quiet || git commit -m "Update profile stats"
          git push
